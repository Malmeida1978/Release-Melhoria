:root{--roxo-fap:#321d6f;--roxo-2:#3d2783;--azul-fap:#5469ed;--laranja-fap:#ff7949;--borda:#5a45a6;--txt:#ffffff;--txt-2:#d9d3f2;--fonte-marca:"Montserrat Alternates",Montserrat,"Segoe UI",sans-serif;color-scheme:dark}
html,body{background:var(--roxo-fap)!important;margin:0}
body{font-family:var(--fonte-marca);color:var(--txt)}
.uni-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--roxo-fap);border-bottom:1px solid rgba(255,255,255,.12);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--roxo-fap)}
.uni-in{max-width:1360px;margin-inline:auto;display:flex;align-items:center;gap:16px 28px;flex-wrap:wrap}
.uni-in .marca-logo{height:44px;width:auto;display:block}
.uni-tabs{display:flex;gap:6px;padding:5px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);flex-wrap:wrap}
.uni-tab{font:inherit;font-size:.9375rem;font-weight:500;min-height:44px;padding:0 20px;border-radius:10px;border:0;background:transparent;color:var(--txt-2);cursor:pointer;display:flex;align-items:center;gap:10px;white-space:nowrap}
.uni-tab .dot{width:.55rem;height:.55rem;border-radius:2px;background:currentColor;opacity:.5}
.uni-tab:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.uni-tab[aria-selected="true"]{background:var(--azul-fap);color:#fff;box-shadow:0 2px 10px rgba(84,105,237,.45)}
.uni-tab[aria-selected="true"] .dot{background:var(--laranja-fap);opacity:1}
.uni-tab:focus-visible{outline:2px solid #a8b5f3;outline-offset:2px}
.uni-sub{color:var(--txt-2);font-size:.8125rem;margin-left:auto}
.uni-frame{display:block;width:100%;border:0;min-height:100vh;background:var(--roxo-fap)}
@media (max-width:640px){.uni-sub{display:none}.uni-tab .pre{display:none}.uni-tabs{flex-wrap:nowrap}.uni-tab{padding:0 14px;font-size:.875rem}.uni-in .marca-logo{height:36px}}

7d32;--e-pub-t:#ffffff;\n  font-family:var(--fonte-marca);color:var(--texto-primario);\n  display:flex;flex-direction:column;gap:32px;font-variant-numeric:tabular-nums;line-height:1.5;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]):not([data-tema=\"claro\"]) #dash-root .gv{\n  --superficie-fundo:#321d6f;--superficie:#3d2783;--superficie-2:#4a3496;--borda:#5a45a6;\n  --texto-primario:#ffffff;--texto-secundario:#d9d3f2;--texto-titulo:#ffffff;\n  --acao-primaria:#8b9bf5;--foco:#a8b5f3;--sucesso:#8fd66b;--atencao:#ffb27f;--critico:#ff8a80;\n  --sombra-card:4px 4px 250px -70px rgba(50,102,244,.9),4px 4px 20px -5px rgba(0,0,0,.3);\n  --e-backlog:#8d89a6;--e-backlog-t:#1b1040;--e-dev:#8b9bf5;--e-dev-t:#1b1040;--e-espera:#ff8a80;--e-espera-t:#1b1040;\n  --e-pteste:#ff7949;--e-pteste-t:#1b1040;--e-teste:#e0b341;--e-teste-t:#1b1040;--e-pub:#8fd66b;--e-pub-t:#1b1040;}}\n:root[data-theme=\"dark\"] #dash-root .gv,:root[data-tema=\"escuro\"] #dash-root .gv{\n  --superficie-fundo:#321d6f;--superficie:#3d2783;--superficie-2:#4a3496;--borda:#5a45a6;\n  --texto-primario:#ffffff;--texto-secundario:#d9d3f2;--texto-titulo:#ffffff;\n  --acao-primaria:#8b9bf5;--foco:#a8b5f3;--sucesso:#8fd66b;--atencao:#ffb27f;--critico:#ff8a80;\n  --sombra-card:4px 4px 250px -70px rgba(50,102,244,.9),4px 4px 20px -5px rgba(0,0,0,.3);\n  --e-backlog:#8d89a6;--e-backlog-t:#1b1040;--e-dev:#8b9bf5;--e-dev-t:#1b1040;--e-espera:#ff8a80;--e-espera-t:#1b1040;\n  --e-pteste:#ff7949;--e-pteste-t:#1b1040;--e-teste:#e0b341;--e-teste-t:#1b1040;--e-pub:#8fd66b;--e-pub-t:#1b1040;}\n\n/* faixa da marca */\n.gv .faixa{background:var(--roxo-fap);border-radius:16px;padding:18px 24px}\n.gv .faixa-in{display:flex;align-items:center;gap:20px;flex-wrap:wrap}\n.gv .marca-logo{height:44px;width:auto;display:block}\n.gv .faixa span{color:#ffffff;font-size:.875rem;font-weight:500;opacity:.85}\n\n/* cabeçalho */\n.gv .gv-head{display:flex;flex-direction:column;gap:4px}\n.gv h1{font-family:var(--fonte-marca);font-weight:400;font-size:1.75rem;line-height:1.25;margin:0;color:var(--texto-titulo);text-wrap:balance}\n.gv .sub{margin:0;color:var(--texto-secundario);font-size:.9375rem}\n.gv .sub span{color:var(--texto-primario);font-weight:600}\n.gv .stamp{margin:0;color:var(--texto-secundario);font-size:.8125rem}\n\n/* cards e títulos */\n.gv h2{font-family:var(--fonte-marca);font-weight:400;font-size:1.25rem;margin:0;color:var(--texto-titulo)}\n.gv .note{color:var(--texto-secundario);font-size:.8125rem;margin:2px 0 16px}\n.gv .card{background:var(--superficie);border:1px solid var(--borda);border-radius:1.5rem;padding:24px;min-width:0;box-shadow:var(--sombra-card)}\n.gv .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));gap:16px}\n\n/* indicadores */\n.gv .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8rem),1fr));gap:12px}\n.gv .kpi{background:var(--superficie);border:1px solid var(--borda);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sombra-card);min-width:0}\n.gv .kpi .lab{font-size:.74rem;font-weight:500;color:var(--texto-secundario);line-height:1.3;min-height:2.6em;display:block;min-width:0;overflow-wrap:break-word}\n.gv .kpi .lab::before{content:\"\";display:inline-block;width:.55rem;height:.55rem;border-radius:2px;margin-right:6px;vertical-align:.05em;background:var(--k,transparent)}\n.gv .kpi .val{font-family:var(--fonte-marca);font-weight:500;font-size:1.75rem;line-height:1.15;color:var(--texto-primario)}\n.gv .kpi.main .val{color:var(--texto-titulo)}\n.gv .kpi.main .lab::before{display:none}\n\n/* fluxo (barra de status segmentada) */\n.gv .pipe{display:flex;gap:2px;min-height:28px;border-radius:8px;overflow:hidden}\n.gv .legend.legend-al{flex-wrap:nowrap;gap:2px;font-size:.8125rem;line-height:1.3}\n.gv .legend-al>span{min-width:5.75rem;padding:0 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;overflow-wrap:break-word;   <input id=\"busca\" type=\"search\" placeholder=\"Buscar por título, cliente, pessoa…\" aria-label=\"Buscar\">\n      <details class=\"ms\" id=\"f-etapa\">\n        <summary aria-label=\"Filtrar etapas\">Etapas: <span id=\"f-etapa-n\">Todas<\/span><\/summary>\n        <div class=\"ms-pop\" role=\"group\" aria-label=\"Etapas\">\n          <div class=\"ms-list\" id=\"f-etapa-list\"><\/div>\n          <div class=\"ms-acts\"><button type=\"button\" id=\"f-etapa-todas\">Marcar todas<\/button><button type=\"button\" id=\"f-etapa-limpar\">Limpar<\/button><\/div>\n        <\/div>\n      <\/details>\n    <\/div>\n    <div class=\"tbl\">\n      <table data-source=\"itens\" data-row-key=\"id\" id=\"tabela\">\n        <thead><tr>\n          <th data-field=\"id\"><button data-k=\"id\">ID<\/button><\/th>\n          <th data-field=\"titulo\"><button data-k=\"titulo\">Título<\/button><\/th>\n          <th data-field=\"cliente\"><button data-k=\"cliente\">Cliente<\/button><\/th>\n          <th data-field=\"etapa\"><button data-k=\"ordem_etapa\">Etapa<\/button><\/th>\n          <th data-field=\"modulo\" class=\"hide-sm\"><button data-k=\"modulo\">Módulo<\/button><\/th>\n          <th data-field=\"responsavel\"><button data-k=\"responsavel\">Assigned To<\/button><\/th>\n          <th data-field=\"dev\" class=\"hide-sm\"><button data-k=\"dev\">Dev<\/button><\/th>\n          <th data-field=\"tester\" class=\"hide-sm\"><button data-k=\"tester\">Tester<\/button><\/th>\n          <th data-field=\"alterado\" class=\"hide-sm\"><button data-k=\"alterado\">Alterado<\/button><\/th>\n        <\/tr><\/thead>\n        <tbody><\/tbody>\n      <\/table>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\n(function(){\nconst ETAPAS=['New','Em documentação','Backlog','Em espera','Em desenv.','Desenv. concluído','Pronto para teste','Em teste','Teste concluído','Pronto para publicação'];\nconst cor=e=>({'New':'var(--e-new)','Teste concluído':'var(--e-tconcl)','Em documentação':'var(--e-doc)','Backlog':'var(--e-backlog)','Em desenv.':'var(--e-dev)','Desenv. concluído':'var(--e-concl)','Em espera':'var(--e-espera)','Pronto para teste':'var(--e-pteste)','Em teste':'var(--e-teste)','Pronto para publicação':'var(--e-pub)'})[e];\nconst corT=e=>({'New':'var(--e-new-t)','Teste concluído':'var(--e-tconcl-t)','Em documentação':'var(--e-doc-t)','Backlog':'var(--e-backlog-t)','Em desenv.':'var(--e-dev-t)','Desenv. concluído':'var(--e-concl-t)','Em espera':'var(--e-espera-t)','Pronto para teste':'var(--e-pteste-t)','Em teste':'var(--e-teste-t)','Pronto para publicação':'var(--e-pub-t)'})[e];\nwindow.__gvEtapas=ETAPAS;window.__gvCor=cor;\n\ndash.calc('por_etapa',{title:'Itens por etapa',description:'Conta as user stories em cada etapa do board e a fatia de cada etapa no total.',inputs:['itens'],\n fn:(itens)=>['New','Em documentação','Backlog','Em espera','Em desenv.','Desenv. concluído','Pronto para teste','Em teste','Teste concluído','Pronto para publicação'].map(e=>{const n=itens.filter(r=>r.etapa===e).length;return {etapa:e,itens:n,pct:itens.length?n/itens.length:0};})});\ndash.calc('totais',{title:'Resumo da sprint',description:'Total de user stories, quantas estão prontas para publicação e quantas faltam.',inputs:['itens'],\n fn:(itens)=>{const p=itens.filter(r=>r.etapa==='Pronto para publicação').length;return [{total:itens.length,prontos:p,pendentes:itens.length-p,pct_pronto:itens.length?p/itens.length:0}];}});\n\nconst pct=d3.format('.0%');\nconst esc=s=>String(s==null?'':s);\nconst el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};\nconst fdt=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';\n\nfunction fail(box){box.innerHTML='';box.appendChild(el('div','fail','Failed to load'));}\n\nfunction barras(box,rows,key){\n  box.innerHTML='';\n  let lg=box.previousElementSibling;if(!lg||!lg.classList.contains('bars-leg')){lg=el('div','bars-leg');box.parentNode.insertBefore(lg,box);}\n  lg.innerHTML='';ETAPAS.forEach(e=>{if(!rows.some(r=>r.etapa===e))return;const l=el('span');const sw=el('span','sw');sw.style.background=cor(e);l.appendChild(sw);l.appendChild(document.createTextNode(e));lg.appendChild(l);});\n  const g=d3.rollups(rows,v=>v,r=>r[key]||'(não definido)').map(([k,v])=>({k,v,n:v.length})).sort((a,b)=>b.n-a.n||a.k.localeCompare(b.k));\n  const max=d3.max(g,d=>d.n)||1;\n  const tip=el('div','tip');tip.hidden=true;box.appendChild(tip);\n  g.forEach(d=>{\n    const r=el('div','br');r.appendChild(el('div','nm',d.k));\n    const tr=el('div','tr');tr.style.width=(d.n/max*100)+'%';\n    ETAPAS.forEach(e=>{const n=d.v.filter(x=>x.etapa===e).length;if(!n)return;const s=el('span',null,String(n));s.style.flex=n;s.style.background=cor(e);s.style.color=corT(e);tr.appendChild(s);});\n    const wrap=el('div');wrap.appendChild(tr);r.appendChild(wrap);r.appendChild(el('div','n',d.n));\n    r.addEventListener('mousemove',ev=>{\n      tip.innerHTML='';tip.appendChild(el('div','h',d.k+' · '+d.n+' itens'));\n      ETAPAS.forEach(e=>{const n=d.v.filter(x=>x.etapa===e).length;if(!n)return;const l=el('div');const sw=el('span','sw');sw.style.background=cor(e);l.appendChild(sw);l.appendChild(document.createTextNode(e+': '+n));tip.appendChild(l);});\n      tip.hidden=false;const b=box.getBoundingClientRect();let x=ev.clientX-b.left+12;const w=tip.offsetWidth;if(x+w>b.width)x=Math.max(0,ev.clientX-b.left-w-12);tip.style.left=x+'px';tip.style.top=(ev.clientY-b.top+12)+'px';});\n    r.addEventListener('mouseleave',()=>tip.hidden=true);\n    box.appendChild(r);\n  });\n}\n\nlet sortK='ordem_etapa',sortDir=1;\nconst busca=document.getElementById('busca'),fEtapa=document.getElementById('f-etapa'),fEtapaList=document.getElementById('f-etapa-list');\nconst etapasSel=new Set();\nfunction etapaOpts(rows){\n  const cnt={};rows.forEach(r=>{cnt[r.etapa]=(cnt[r.etapa]||0)+1;});\n  const lista=ETAPAS.filter(e=>cnt[e]||etapasSel.has(e)).concat(Object.keys(cnt).filter(e=>!ETAPAS.includes(e)));\n  fEtapaList.replaceChildren(...lista.map(e=>{const l=el('label');const c=el('input');c.type='checkbox';c.value=e;c.checked=etapasSel.has(e);\n    c.addEventListener('change',()=>{c.checked?etapasSel.add(e):etapasSel.delete(e);draw();});\n    const sw=el('span','sw');sw.style.background=cor(e);l.append(c,sw,document.createTextNode(e),el('span','q',String(cnt[e]||0)));return l;}));\n  const n=etapasSel.size;document.getElementById('f-etapa-n').textContent=!n?'Todas':n===1?[...etapasSel][0]:n+' selecionadas';\n  fEtapa.classList.toggle('on',n>0);\n}\ndocument.getElementById('f-etapa-limpar').addEventListener('click',()=>{etapasSel.clear();draw();});\ndocument.getElementById('f-etapa-todas').addEventListener('click',()=>{fEtapaList.querySelectorAll('input').forEach(c=>etapasSel.add(c.value));draw();});\ndocument.addEventListener('click',e=>{if(fEtapa.open&&!fEtapa.contains(e.target))fEtapa.open=false;});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'&&fEtapa.open){fEtapa.open=false;fEtapa.querySelector('summary').focus();}});\n\nfunction tabela(rows){\n  const tb=document.querySelector('#tabela tbody');tb.innerHTML='';\n  etapaOpts(rows);\n  const q=busca.value.trim().toLowerCase();\n  let rs=rows.filter(r=>(!etapasSel.size||etapasSel.has(r.etapa))&&(!q||[r.id,r.titulo,r.cliente,r.modulo,r.dev,r.tester,r.responsavel,r.etapa].join(' ').toLowerCase().includes(q)));\n  rs=rs.slice().sort((a,b)=>{const x=a[sortK],y=b[sortK];return (typeof x==='number'?x-y:esc(x).localeCompare(esc(y)))*sortDir||(a.id-b.id);});\n  document.querySelectorAll('#tabela th').forEach(th=>{const k=th.querySelector('button').dataset.k;th.setAttribute('aria-sort',k===sortK?(sortDir>0?'ascending':'descending'):'none');});\n  rs.forEach(r=>{\n    const tr=el('tr');\n    const td0=el('td');const a=el('a',null,String(r.id));a.href=r.link;a.target='_blank';a.rel='noopener';td0.appendChild(a);tr.appendChild(td0);\n    tr.appendChild(el('td',null,r.titulo));tr.appendChild(el('td',null,r.cliente));\n    const te=el('td');const sw=el('span','sw');sw.style.background=cor(r.etapa);te.appendChild(sw);te.appendChild(document.createTextNode(r.etapa));te.style.whiteSpace='nowrap';tr.appendChild(te);\n    tr.appendChild(el('td','hide-sm',r.modulo));\n    tr.appendChild(el('td',null,r.responsavel));\n    tr.appendChild(el('td','hide-sm',r.dev));tr.appendChild(el('td','hide-sm',r.tester));tr.appendChild(el('td','hide-sm',fdt(r.alterado)));\n    tb.appendChild(tr);\n  });\n}\ndocument.querySelectorAll('#tabela th button').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;if(sortK===k)sortDir=-sortDir;else{sortK=k;sortDir=1;}draw();}));\nbusca.addEventListener('input',()=>draw());\n\nfunction draw(){\n  const it=dash.data('itens'),pe=dash.data('por_etapa'),tt=dash.data('totais');\n  const okI=it.status==='ok',rows=okI?it.data:[];\n  const fill=(sel,v)=>document.querySelectorAll(sel).forEach(n=>{n.classList.remove('dash-skeleton');n.textContent=v;});\n  // resumo\n  if(tt.status==='ok'&&tt.data[0]){const t=tt.data[0];\n    fill('#takeaway [data-field=prontos]',t.prontos);fill('#takeaway [data-field=total]',t.total);fill('#takeaway [data-field=pct_pronto]',pct(t.pct_pronto));fill('#takeaway [data-field=pendentes]',t.pendentes);}\n  else if(tt.status!=='loading'){fill('#takeaway span','—');}\n  // KPIs\n  const k=document.getElementById('kpis');k.innerHTML='';\n  const rowsE=pe.status==='ok'?pe.data:null;\n  const tile=(lab,val,cl,attrs,main)=>{const d=el('div',main?'kpi main':'kpi');if(cl)d.style.setProperty('--k',cl);d.appendChild(el('div','lab',lab));const v=el('div','val',val);Object.entries(attrs).forEach(([a,b])=>v.setAttribute(a,b));if(val==='—'&&rowsE===null)v.classList.add('dash-skeleton');d.appendChild(v);k.appendChild(d);};\n  const T=tt.status==='ok'&&tt.data[0];\n  tile('Total na release',T?T.total:'—',null,{'data-source':'totais','data-field':'total','data-row':'0'},true);\n  ETAPAS.slice().reverse().forEach(e=>{const r=rowsE&&rowsE.find(x=>x.etapa===e);if(['New','Teste concluído'].includes(e)&&!(r&&r.itens))return;tile(e,r?r.itens:'—',cor(e),{'data-source':'por_etapa','data-field':'itens','data-where':'etapa='+encodeURIComponent(e)});});\n  tile('% pronto',T?pct(T.pct_pronto):'—','var(--e-pub)',{'data-source':'totais','data-field':'pct_pronto','data-row':'0'});\n  // pipeline\n  const pipe=document.getElementById('pipe'),leg=document.getElementById('pipe-leg');pipe.innerHTML='';leg.innerHTML='';\n  if(pe.status==='error')fail(pipe);\n  else if(rowsE){rowsE.forEach(r=>{if(!r.itens)return;const d=el('div',null,String(r.itens));const pp=el('span','pp','\\u00a0· '+pct(r.pct));d.appendChild(pp);d.style.flex=r.itens+' 1 0';d.style.background=cor(r.etapa);d.style.color=corT(r.etapa);d.title='';pipe.appendChild(d);\n    const l=el('span');l.style.flex=r.itens+' 1 0';const sw=el('span','sw');sw.style.background=cor(r.etapa);l.appendChild(sw);l.appendChild(document.createTextNode(r.etapa+' ('+r.itens+')'));leg.appendChild(l);});}\n  else pipe.classList.add('dash-skeleton');\n  if(rowsE)pipe.classList.remove('dash-skeleton');\n  // board\n  const bd=document.getElementById('board');bd.innerHTML='';\n  if(it.status==='error'){fail(bd);}\n  else if(okI){['New','Em documentação','Backlog','Em espera','Em desenv.','Desenv. concluído','Pronto para teste','Em teste','Teste concluído'].filter(e=>!['New','Teste concluído'].includes(e)||rows.some(r=>r.etapa===e)).forEach(e=>{\n    const c=el('div','col');c.style.setProperty('--c',cor(e));\n    const its=rows.filter(r=>r.etapa===e).sort((a,b)=>a.id-b.id);\n    const h=el('div','colh');const hl=el('span');hl.appendChild(el('span','dot'));hl.appendChild(document.createTextNode(e));h.appendChild(hl);h.appendChild(el('span','pill',String(its.length)));c.appendChild(h);\n    if(!its.length)c.appendChild(el('div','m','Nenhum item'));\n    its.forEach(r=>{const t=el('div','tk');t.style.setProperty('--c',cor(e));\n      const top=el('div','m');const a=el('a',null,'#'+r.id);a.href=r.link;a.target='_blank';a. ap:wrap;gap:var(--cds-gap-sm) var(--cds-gap-lg);font-size:var(--cds-font-size-body);color:var(--color-fg)}\n.gv-legend b{font-variant-numeric:tabular-nums}\n.gv-sw{display:inline-block;width:.6rem;height:.6rem;border-radius:2px;margin-right:.4rem}\n.gv-statuswrap{display:flex;flex-direction:column;gap:var(--cds-gap-sm);min-height:3.5rem}\n.gv-bars{position:relative;display:flex;flex-direction:column;gap:var(--cds-gap-sm);min-height:6rem}\n.gv-bar{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) 2rem;align-items:center;gap:var(--cds-gap-sm);font-size:var(--cds-font-size-caption);cursor:default}\n.gv-bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.gv-bar .tr{display:flex;height:14px;gap:1px}\n.gv-bar .tr span{height:100%;border-radius:2px}\n.gv-bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--color-fg-muted)}\n.gv-bar:hover .nm{color:var(--color-fg);text-decoration:underline}\n.gv-tip{position:absolute;z-index:3;pointer-events:none;background:var(--cds-surface-popover);border:1px solid var(--cds-border);border-radius:var(--cds-radius);box-shadow:var(--cds-shadow-popover);padding:var(--cds-pad-xs) var(--cds-pad-sm);font-size:var(--cds-font-size-caption);white-space:nowrap}\n.gv-tip .t{color:var(--cds-text-secondary);margin-bottom:2px}\n.gv-keys{display:flex;gap:var(--cds-gap-lg);font-size:var(--cds-font-size-caption);color:var(--color-fg-muted);margin-bottom:var(--cds-gap-md)}\n.gv-tw{overflow:auto;max-height:30rem}\n.gv table{width:100%;border-collapse:collapse;font-size:var(--cds-font-size-caption);font-variant-numeric:tabular-nums}\n.gv th{position:sticky;top:0;background:var(--color-panel);text-align:left;font-weight:var(--cds-font-weight-medium);color:var(--color-fg-muted);padding:6px 8px;border-bottom:1px solid var(--color-border-line);white-space:nowrap;z-index:1}\n.gv td{padding:7px 8px;border-bottom:1px solid var(--color-border-line);vertical-align:top}\n.gv td.tt{min-width:16rem}\n.gv td a{color:inherit}\n.gv-sort{all:unset;cursor:pointer}\n.gv-sort:focus-visible{outline:2px solid var(--color-fg);outline-offset:2px}\n.gv th[aria-sort=ascending] .gv-sort::after{content:\" ↑\"}\n.gv th[aria-sort=descending] .gv-sort::after{content:\" ↓\"}\n.gv-pill{display:inline-block;padding:0 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;line-height:1.6}\n.gv-pill.ok{color:var(--color-ok)}\n.gv-pill.warn{color:var(--color-warn)}\n.gv-pill.bad{color:var(--color-bad)}\n.gv-search{display:flex;gap:var(--cds-gap-sm);align-items:center;margin-bottom:var(--cds-gap-md)}\n.gv-search input{flex:1;max-width:22rem;font:inherit;font-size:var(--cds-font-size-body);padding:6px 10px;border:1px solid var(--color-border-line);border-radius:var(--cds-radius);background:var(--color-bg);color:var(--color-fg)}\n.gv-copy{font:inherit;font-size:var(--cds-font-size-body);padding:6px 12px;border:1px solid var(--color-border-line);border-radius:var(--cds-radius);background:var(--color-bg);color:var(--color-fg);cursor:pointer;white-space:nowrap}\n.gv-copy:hover{border-color:var(--color-fg-muted)}\n.gv-copy:focus-visible{outline:2px solid var(--color-fg);outline-offset:2px}\n.gv-copy .c-ok{color:var(--color-ok)}\n.gv-copy-area{width:100%;min-height:6rem;margin-bottom:var(--cds-gap-md);font:inherit;font-size:var(--cds-font-size-caption);background:var(--color-bg);color:var(--color-fg);border:1px solid var(--color-border-line);border-radius:var(--cds-radius);padding:var(--cds-pad-sm)}\n.gv-fail{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:inherit;color:var(--color-fg-muted);font-size:var(--cds-font-size-caption)}\n.gv-fail .dot{width:.375rem;height:.375rem;border-radius:50%;background:var(--color-bad)}\n[data-dash-source-state=empty]{color:transparent}\n[data-dash-source-state=refreshing]{opacity:.5;transition:opacity var(--cds-dur-slow)}\n@media (max-width:720px){.gv .sec{display:none}}\n.gv-legend.gv-legend-al{flex-wrap:nowrap;gap:2px}\n.gv-legend-al .gv-lg{min-width:5.25rem;padding:0 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;font-size:var(--cds-font-size-caption);line-height:1.3}\n.gv-legend-al .gv-lg-t{display:inline-flex;align-items:baseline;justify-content:center;gap:0;overflow-wrap:break-word;hyphens:none}\n.gv-legend-al .gv-lg-t .gv-sw{flex:0 0 auto}\n.gv-legend-al .gv-lg-v{color:var(--color-fg-muted)}\n.gv-legend-al .gv-lg-v b{color:var(--color-fg)}\n@media (max-width:720px){.gv-status .seg,.gv-legend-al .gv-lg{min-width:3.25rem;padding:0 3px}.gv-legend-al .gv-lg-t{overflow-wrap:anywhere}}\n@media (max-width:480px){.gv-status .seg{min-width:1.75rem;padding:0 2px}.gv-legend.gv-legend-al{flex-wrap:wrap;gap:var(--cds-gap-sm) var(--cds-gap-lg)}.gv-legend-al .gv-lg{flex:0 0 auto!important;align-items:flex-start;text-align:left;padding:0}}\n<\/style>\n\n<div class=\"gv\">\n  <header class=\"gv-head\" id=\"topo\">\n    <h1>Gestão à vista · NOGAP · <b data-draw=\"resumo\" data-source=\"resumo\" data-field=\"entrega\" data-row=\"0\" class=\"dash-skeleton\">—<\/b><\/h1>\n    <p><b data-draw=\"resumo\" data-source=\"resumo\" data-field=\"resolvidos\" data-row=\"0\" class=\"dash-skeleton\">—<\/b> de <b data-draw=\"resumo\" data-source=\"resumo\" data-field=\"total\" data-row=\"0\" class=\"dash-skeleton\">—<\/b> itens do pacote estão resolvidos. Ainda faltam <b data-draw=\"resumo\" data-source=\"resumo\" data-field=\"pendentes\" data-row=\"0\" class=\"dash-skeleton\">—<\/b>, listados em Pendências abaixo. O pacote tem <b data-draw=\"resumo\" data-source=\"resumo\" data-field=\"bugs\" data-row=\"0\" class=\"dash-skeleton\">—<\/b> bugs (<b data-draw=\"resumo\" data-source=\"resumo\" data-field=\"bugs_pend\" data-row=\"0\" class=\"dash-skeleton\">—<\/b> pendentes) e <b data-draw=\"resumo\" data-source=\"resumo\" data-field=\"stories\" data-row=\"0\" class=\"dash-skeleton\">—<\/b> user stories (<b data-draw=\"resumo\" data-source=\"resumo\" data-field=\"stories_pend\" data-row=\"0\" class=\"dash-skeleton\">—<\/b> pendentes).<\/p>\n  <\/header>\n\n  <section class=\"gv-tiles\" aria-label=\"Indicadores\">\n    <div class=\"gv-tile\"><span class=\"lbl\">Itens no pacote<\/span><span class=\"num dash-skeleton\" data-draw=\"resumo\" data-source=\"resumo\" data-field=\"total\" data-row=\"0\">—<\/span><span class=\"sub\">Bugs e user stories<\/span><\/div>\n    <div class=\"gv-tile\"><span class=\"lbl\">Resolvidos<\/span><span class=\"num dash-skeleton\" data-draw=\"resumo\" data-source=\"resumo\" data-field=\"resolvidos\" data-row=\"0\">—<\/span><span class=\"sub\">Estados Resolved ou Done<\/span><\/div>\n    <div class=\"gv-tile\"><span class=\"lbl\">Pendentes<\/span><span class=\"num dash-skeleton\" data-draw=\"resumo\" data-source=\"resumo\" data-field=\"pendentes\" data-row=\"0\">—<\/span><span class=\"sub\">Em teste ou em desenvolvimento<\/span><\/div>\n    <div class=\"gv-tile\"><span class=\"lbl\">Pronto<\/span><span class=\"num dash-skeleton\" data-draw=\"resumo\" data-source=\"resumo\" data-field=\"pct\" data-row=\"0\">—<\/span><span class=\"sub\">Resolvidos ÷ total<\/span><\/div>\n    <div class=\"gv-tile\"><span class=\"lbl\">Bugs<\/span><span class=\"num dash-skeleton\" data-draw=\"resumo\" data-source=\"resumo\" data-field=\"bugs\" data-row=\"0\">—<\/span><span class=\"sub\"><span data-draw=\"resumo\" data-source=\"resumo\" data-field=\"bugs_res\" data-row=\"0\">—<\/span> resolvidos · <span data-draw=\"resumo\" data-source=\"resumo\" data-field=\"bugs_pend\" data-row=\"0\">—<\/span> pendentes<\/span><span class=\"sub\">Suporte <span data-draw=\"resumo\" data-source=\"resumo\" data-field=\"bugs_suporte\" data-row=\"0\">—<\/span> · Produto <span data-draw=\"resumo\" data-source=\"resumo\" data-field=\"bugs_produto\" data-row=\"0\">—<\/span><\/span><\/div>\n    <div class=\"gv-tile\"><span class=\"lbl\">User Stories<\/span><span class=\"num dash-skeleton\" data-draw=\"resumo\" data-source=\"resumo\" data-field=\"stories\" data-row=\"0\"> =\"tile\" data-tile=\"Aguardando\"><span class=\"lbl\"><i class=\"sw\" data-sw=\"Aguardando\"><\/i>Aguardando<\/span><span class=\"num\" data-draw=\"kpi\" data-source=\"kpis\" data-field=\"aguardando\" data-where=\"filtro=Novo|Em atendimento|Aguardando\">—<\/span><span class=\"split\"><span class=\"row\"><span>Retorno do cliente<\/span><b data-draw=\"kpi\" data-source=\"kpis\" data-field=\"ag_cliente\" data-where=\"filtro=Novo|Em atendimento|Aguardando\">—<\/b><\/span><span class=\"row\"><span>Equipe de desenvolvimento<\/span><b data-draw=\"kpi\" data-source=\"kpis\" data-field=\"ag_dev\" data-where=\"filtro=Novo|Em atendimento|Aguardando\">—<\/b><\/span><\/span><\/div>\n    <div class=\"tile alert\"><span class=\"lbl\">Sem ação há mais de 7 dias<\/span><span class=\"num\" data-draw=\"kpi\" data-source=\"kpis\" data-field=\"sem_acao_7d\" data-where=\"filtro=Novo|Em atendimento|Aguardando\">—<\/span><span class=\"sub\">pedem follow-up<\/span><\/div>\n    <div class=\"tile\"><span class=\"lbl\">Dia com mais aberturas em 2026<\/span><span class=\"num\" data-draw=\"abk\" data-source=\"abertura_extremos\" data-field=\"max_n\" data-row=\"0\">—<\/span><span class=\"sub\" data-draw=\"abk\" data-source=\"abertura_extremos\" data-field=\"max_dia\" data-row=\"0\">—<\/span><\/div>\n    <div class=\"tile\"><span class=\"lbl\">Urgência crítica ou alta<\/span><span class=\"num\" data-draw=\"kpi\" data-source=\"kpis\" data-field=\"criticas\" data-where=\"filtro=Novo|Em atendimento|Aguardando\">—<\/span><span class=\"sub\">1.Crítica e 2.Alta<\/span><\/div>\n  <\/section>\n\n  <section class=\"abertura\" id=\"abertura\" aria-label=\"Chamados abertos\">\n    <div class=\"sec-head\">\n      <h2>Chamados abertos em 2026<\/h2>\n      <p class=\"note\">Todos os chamados abertos em 2026 com Fila = SUPORTE, em qualquer status (inclusive resolvidos e fechados). Não muda com o filtro de status. Dados até <span data-draw=\"abk\" data-source=\"abertura_resumo\" data-field=\"dia_ref\" data-row=\"0\">—<\/span>.<\/p>\n    <\/div>\n    <div class=\"tiles\">\n      <div class=\"tile\"><span class=\"lbl\">Abertos em 2026<\/span><span class=\"num\" data-draw=\"abk\" data-source=\"abertura_resumo\" data-field=\"ano\" data-row=\"0\">—<\/span><span class=\"sub\">de 01/01/2026 até hoje<\/span><\/div>\n      <div class=\"tile\"><span class=\"lbl\">Abertos hoje<\/span><span class=\"num\" data-draw=\"abk\" data-source=\"abertura_resumo\" data-field=\"hoje\" data-row=\"0\">—<\/span><span class=\"sub\">no dia da extração<\/span><\/div>\n      <div class=\"tile\"><span class=\"lbl\">Últimos 7 dias<\/span><span class=\"num\" data-draw=\"abk\" data-source=\"abertura_resumo\" data-field=\"ult7\" data-row=\"0\">—<\/span><span class=\"sub\">média de <span data-draw=\"abk\" data-source=\"abertura_resumo\" data-field=\"media7\" data-row=\"0\">—<\/span> por dia<\/span><\/div>\n      <div class=\"tile\"><span class=\"lbl\">Média por dia no mês atual<\/span><span class=\"num\" data-draw=\"abk\" data-source=\"abertura_resumo\" data-field=\"media_mes\" data-row=\"0\">—<\/span><span class=\"sub\">em <span data-draw=\"abk\" data-source=\"abertura_resumo\" data-field=\"dias_mes\" data-row=\"0\">—<\/span> dias corridos · <span data-draw=\"abk\" data-source=\"abertura_resumo\" data-field=\"media_util_mes\" data-row=\"0\">—<\/span> por dia útil<\/span><\/div>\n      <div class=\"tile\"><span class=\"lbl\">No mês atual<\/span><span class=\"num\" data-draw=\"abk\" data-source=\"abertura_resumo\" data-field=\"mes\" data-row=\"0\">—<\/span><span class=\"sub\">do dia 1º até hoje<\/span><\/div>\n    <\/div>\n    <div class=\"grid ab-full\">\n      <div class=\"card\" id=\"abertura-mes\">\n        <h2>Abertos e resolvidos por mês<\/h2>\n        <p class=\"note\">Fila SUPORTE em 2026. Resolvidos contam pela data de resolução. O mês atual está parcial.<\/p>\n        <div class=\"legend\"><span><i class=\"sw\" data-sw-ab=\"abertos\"><\/i>Abertos<\/span><span><i class=\"sw\" data-sw-ab=\"resolvidos\" <\/div>\n    <\/div>\n    <div class=\"card\" id=\"urgencia\">\n      <h2>Por urgência<\/h2>\n      <p class=\"note\">Urgência atribuída no Movidesk.<\/p>\n      <div class=\"chart\" data-draw=\"stack\" data-source=\"por_urgencia\" data-label=\"urgencia\" data-keep-order=\"1\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"card\" id=\"chamados\">\n    <h2>Chamados<\/h2>\n    <p class=\"note\">Chamados nos status selecionados. Filtre por justificativa, responsável e status Azure (dá para marcar vários) e clique no cabeçalho para ordenar; dias sem ação acima de 7 em vermelho, de 4 a 7 em amarelo.<\/p>\n    <div class=\"tools\">\n      <input id=\"gv-busca\" class=\"busca\" type=\"search\" placeholder=\"Buscar número, cliente, responsável…\" aria-label=\"Buscar chamados\">\n      <div class=\"fgroup\">\n        <div class=\"ms\" id=\"filtro-justificativa\">\n          <button type=\"button\" class=\"ms-btn\" data-ms-btn=\"justificativa\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-controls=\"pop-justificativa\">Justificativa: <span class=\"ms-n\" data-draw=\"msn\" data-col=\"justificativa\" data-all=\"Todas\">—<\/span><\/button>\n          <div class=\"ms-pop\" id=\"pop-justificativa\" data-ms-pop=\"justificativa\" hidden>\n            <div class=\"ms-acts\"><button type=\"button\" data-ms-all=\"justificativa\">Marcar todas<\/button><button type=\"button\" data-ms-none=\"justificativa\">Desmarcar todas<\/button><\/div>\n            <div class=\"ms-list\" data-draw=\"msopts\" data-source=\"tabela\" data-col=\"justificativa\" data-empty=\"(sem justificativa)\" role=\"group\" aria-label=\"Justificativas\"><\/div>\n            <p class=\"ms-empty\" data-ms-warn=\"justificativa\" hidden>Nenhuma marcada: a tabela fica vazia.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"ms\" id=\"filtro-responsavel\">\n          <button type=\"button\" class=\"ms-btn\" data-ms-btn=\"responsavel\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-controls=\"pop-responsavel\">Responsável: <span class=\"ms-n\" data-draw=\"msn\" data-col=\"responsavel\" data-all=\"Todos\">—<\/span><\/button>\n          <div class=\"ms-pop\" id=\"pop-responsavel\" data-ms-pop=\"responsavel\" hidden>\n            <div class=\"ms-acts\"><button type=\"button\" data-ms-all=\"responsavel\">Marcar todos<\/button><button type=\"button\" data-ms-none=\"responsavel\">Desmarcar todos<\/button><\/div>\n            <div class=\"ms-list\" data-draw=\"msopts\" data-source=\"tabela\" data-col=\"responsavel\" data-empty=\"(sem responsável)\" role=\"group\" aria-label=\"Responsáveis\"><\/div>\n            <p class=\"ms-empty\" data-ms-warn=\"responsavel\" hidden>Nenhum marcado: a tabela fica vazia.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"ms\" id=\"filtro-status-azure\">\n          <button type=\"button\" class=\"ms-btn\" data-ms-btn=\"status_azure\" aria-haspopup=\"true\" aria-expanded=\"false\" aria-controls=\"pop-status_azure\">Status Azure: <span class=\"ms-n\" data-draw=\"msn\" data-col=\"status_azure\" data-all=\"Todos\">—<\/span><\/button>\n          <div class=\"ms-pop\" id=\"pop-status_azure\" data-ms-pop=\"status_azure\" hidden>\n            <div class=\"ms-acts\"><button type=\"button\" data-ms-all=\"status_azure\">Marcar todos<\/button><button type=\"button\" data-ms-none=\"status_azure\">Desmarcar todos<\/button><\/div>\n            <div class=\"ms-list\" data-draw=\"msopts\" data-source=\"tabela\" data-col=\"status_azure\" data-empty=\"(sem atividade no Azure)\" role=\"group\" aria-label=\"Status Azure\"><\/div>\n            <p class=\"ms-empty\" data-ms-warn=\"status_azure\" hidden>Nenhum marcado: a tabela fica vazia.<\/p>\n          <\/div>\n        <\/div>\n        <button type=\"button\" class=\"gv-limpar\">Limpar filtros<\/button>\n      <\/div>\n      <span class=\"count\"><span data-draw=\"tblcount\">—<\/span> chamados exibidos<\/span>\n    <\/div>\n    <div class=\"tblwrap\">\n      <table data-source=\"tabela\" data-row-key=\"numero\">\n        <thead><tr>\n          <th data-field=\"numero\"><button type=\"button\" data-sort=\"numero\">Número<\/button><\/th>\n          <th data-field=\"aberto_em\"><button type=\"button\" data-sort=\"aberto_ts\">Aberto em<\/button><\/th>\n          <th data-field=\"atividade\"><button type=\"button\" data-sort=\"atividade\">Atividade Nº<\/button><\/th>\n          <th data-field=\"status_azure\"><button type=\"button\" data-sort=\"status_azure\">Status Azure<\/button><\/th>\n          <th data-field=\"area_path\"><button type=\"button\" data-sort=\"area_path\">Area Path<\/button><\/th>\n          <th data-field=\"empresa\"><button type=\"button\" data-sort=\"empresa\">Cliente<\/button><\/th>\n          <th data-field=\"justificativa\"><button type=\"button\" data-sort=\"justificativa\">Justificativa<\/button><\/th>\n          <th data-field=\"status\"><button type=\"button\" data-sort=\"status\">Status<\/button><\/th>\n          <th data-field=\"responsavel\"><button type=\"button\" data-sort=\"responsavel\">Responsável<\/button><\/th>\n          <th data-field=\"ultima_acao\"><button type=\"button\" data-sort=\"acao_ts\">Última ação<\/button><\/th>\n          <th data-field=\"dias_sem_acao\"><button type=\"button\" data-sort=\"dias_sem_acao\">Dias sem ação<\/button><\/th>\n        <\/tr><\/thead>\n        <tbody data-draw=\"tbl\"><\/tbody>\n      <\/table>\n    <\/div>\n  <\/section>\n<\/div>\n\n<script>\n// Abertura de chamados (fila SUPORTE, todos os status)\ndash.calc('abertura_resumo', {\n  inputs: ['abertura'],\n  title: 'Resumo de abertura',\n  description: 'Chamados abertos no último dia da extração, nos últimos 7 dias, no mês (total e média por dia corrido e por dia útil, de segunda a sexta) e no ano.',\n  fn: (abertura) => {\n    const rows = abertura.map((r) => ({ dia: String(r.dia).slice(0, 10), n: Number(r.abertos) || 0 })).sort((a, b) => a.dia.localeCompare(b.dia));\n    if (!rows.length) return [];\n    const ref = rows[rows.length - 1].dia;\n    const t = (d) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));\n    const r0 = t(ref);\n    const soma = (f) => rows.filter(f).reduce((a, r) => a + r.n, 0);\n    const ult7 = soma((r) => r0 - t(r.dia) < 7 * 864e5);\n    return [{\n      dia_ref: `${ref.slice(8, 10)}/${ref.slice(5, 7)}/${ref.slice(0, 4)}`,\n      hoje: soma((r) => r.dia === ref),\n      ult7,\n      media7: Math.round((ult7 / 7) * 10) / 10,\n      mes: soma((r) => r.dia.slice(0, 7) === ref.slice(0, 7)),\n      media_mes: Math.round((soma((r) => r.dia.slice(0, 7) === ref.slice(0, 7)) / +ref.slice(8, 10)) * 10) / 10,\n      dias_mes: +ref.slice(8, 10),\n      media_util_mes: (() => {\n        let uteis = 0;\n        for (let d = 1; d <= +ref.slice(8, 10); d++) { const w = new Date(Date.UTC(+ref.slice(0, 4), +ref.slice(5, 7) - 1, d)).getUTCDay(); if (w > 0 && w < 6) uteis += 1; }\n        const n = soma((r) => r.dia.slice(0, 7) === ref.slice(0, 7) && (() => { const w = new Date(t(r.dia)).getUTCDay(); return w > 0 && w < 6; })());\n        return uteis ? Math.round((n / uteis) * 10) / 10 : 0;\n      })(),\n      ano: soma((r) => r.dia.slice(0, 4) === ref.slice(0, 4)),\n    }];\n  },\n});\ndash.calc('abertura_extremos', {\n  inputs: ['abertura'],\n  title: 'Dias com mais e menos aberturas',\n  description: 'Entre os dias úteis de 2026 já encerrados (segunda a sexta, sem feriados nacionais, Carnaval e Corpus Christi, e sem o dia de hoje, ainda parcial), o dia com mais e o dia com menos chamados abertos.',\n  fn: (abertura) => {\n    const FERIADOS = ['2026-01-01', '2026-02-16', '2026-02-17', '2026-04-03', '2026-04-21', '2026-05-01', '2026-06-04', '2026-09-07', '2026-10-12', '2026-11-02', '2026-11-20', '2026-12-25'];\n    const sem = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];\n    const m = new Map(abertura.map((r) => [String(r.dia).slice(0, 10), Number(r.abertos) || 0]));\n    const dias = [...m.keys()].sort();\n    if (!dias.length) return [];\n    const ultimo = dias[dias.length - 1];\n    const ini = Date.UTC(+ultimo.slice(0, 4), 0, 1), fim = Date.UTC(+ultimo.slice(0, 4), +ultimo.slice(5, 7) - 1, +ultimo.slice(8, 10));\n    const uteis = [];\n    for (let t = ini; t < fim; t += 864e5) {\n      const d = new Date(t), k = d.toISOString().slice(0, 10), w = d.getUTCDay();\n      if (w > 0 && w < 6 && !FERIADOS.includes(k)) uteis.push({ k, w, n: m.get(k) || 0 });\n    }\n    if (!uteis.length) return [];\n    const fmt = (x) => `${x.k.slice(8, 10)}/${x.k.slice(5, 7)}/${x.k.slice(0, 4)} (${sem[x.w]})`;\n    const mx = Math.max(...uteis.map((x) => x.n)), mn = Math.min(...uteis.map((x) => x.n));\n    const dMx = uteis.filter((x) => x.n === mx), dMn = uteis.filter((x) => x.n === mn);\n    return [{ max_n: mx, max_dia: dMx.map(fmt).join(' e '), min_n: mn, min_dia: dMn.map(fmt).join(' e '), dias_uteis: uteis.length }];\n  },\n});\n\ndash.calc('abertura_mensal', {\n  inputs: ['abertura', 'resolucao_mensal'],\n  title: 'Abertura e resolução por mês',\n  description: 'Chamados abertos (soma diária) e resolvidos (pela data de resolução) em cada mês, de janeiro até o mês da extração.',\n  fn: (abertura, resolucao_mensal) => {\n    const rm = new Map(resolucao_mensal.map((r) => [String(r.mes).slice(0, 7), Number(r.resolvidos) || 0]));\n    const nomes = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];\n    const m = new Map();\n    let ult = '';\n    for (const r of abertura) { const d = String(r.dia).slice(0, 7); m.set(d, (m.get(d) || 0) + (Number(r.abertos) || 0)); if (d > ult) ult = d; }\n    if (!ult) return [];\n    const ano = ult.slice(0, 4), out = [];\n    for (let i = 1; i <= +ult.slice(5, 7); i++) {\n      const k = `${ano}-${String(i).padStart(2, '0')}`;\n      out.push({ mes: k, rotulo: nomes[i - 1].slice(0, 3), mes_nome: `${nomes[i - 1]} de ${ano}`, abertos: m.get(k) || 0, resolvidos: rm.has(k) ? rm.get(k) : null });\n    }\n    return out;\n  },\n});\ndash.calc('abertura_30d', {\n  inputs: ['abertura', 'resolucao'],\n  title: 'Abertura nos últimos 30 dias',\n  description: 'Chamados abertos, resolvidos e fechados por dia nos 30 dias até a extração; dias sem registro contam zero.',\n  fn: (abertura, resolucao) => {\n    const m = new Map(abertura.map((r) => [String(r.dia).slice(0, 10), Number(r.abertos) || 0]));\n    const rs = new Map(resolucao.map((r) => [String(r.dia).slice(0, 10), r]));\n    const dias = [...m.keys()].sort();\n    if (!dias.length) return [];\n    const ref = dias[dias.length - 1];\n    const r0 = Date.UTC(+ref.slice(0, 4), +ref.slice(5, 7) - 1, +ref.slice(8, 10));\n    const sem = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];\n    const out = [];\n    for (let i = 29; i >= 0; i--) {\n      const d = new Date(r0 - i * 864e5);\n      const k = d.toISOString().slice(0, 10);\n      const z = rs.get(k);\n      out.push({ data: k, rotulo: `${k.slice(8, 10)}/${k.slice(5, 7)}`, dia: `${sem[d.getUTCDay()]}, ${k.slice(8, 10)}/${k.slice(5, 7)}`, abertos: m.get(k) || 0, resolvidos: z ? Number(z.resolvidos) || 0 : null, fechados: z ? Number(z.fechados) || 0 : null });\n    }\n    return out;\n  },\n});\n\n// Cálculos sobre a extração do Movidesk\ndash.calc('tabela', {\n  inputs: ['chamados'],\n  title: 'Chamados com dias',\n  description: 'Cada chamado com dias em aberto e dias sem ação, contados até a última movimentação registrada na extração.',\n  fn: (chamados) => {\n    const p = (s) => { if (!s) return NaN; const [d, t] = s.split(' '); const [dd, mm, yy] = d.split('/'); const [h, mi] = (t || '0:0').split(':'); return Date.UTC(+yy, +mm - 1, +dd, +h, +mi); };\n    const ref = Math.max(...chamados.flatMap((c) => [p(c.aberto_em), p(c.ultima_acao)]).filter((x) => !isNaN(x)));\n    return chamados.map((c) => ({\n      ...c,\n      aberto_ts: p(c.aberto_em),\n      acao_ts: p(c.ultima_acao),\n      dias_aberto: Math.floor((ref - p(c.aberto_em)) / 864e5),\n      dias_sem_acao: Math.floor((ref - p(c.ultima_acao)) / 864e5),\n    }));\n  },\n});\n\ndash.calc('kpis', {\n  inputs: ['tabela'],\n  title: 'Indicadores da fila',\n  description: 'Para cada combinação de status (coluna filtro), os totais por status, aguardando por justificativa, chamados sem ação há mais de 7 dias, de urgência crítica ou alta e a situação do SLA de solução do Movidesk (no prazo = a vencer ou vence hoje, sobre os que têm SLA correndo).',\n  fn: (tabela) => {\n    const S = ['Novo', 'Em atendimento', 'Aguardando'];\n    let ref = tabela[0]; for (const c of tabela) if (c.acao_ts > ref.acao_ts) ref = c;\n    const out = [];\n    for (let m = 1; m < 8; m++) {\n      const sel = S.filter((_, i) => (m >> i) & 1);\n      const t = tabela.filter((c) => sel.includes(c.status));\n      const n = (f) => t.filter(f).length;\n      out.push({\n        filtro: sel.join('|'),\n        total: t.length,\n        novo: n((c) => c.status === 'Novo'),\n        em_atendimento: n((c) => c.status === 'Em atendimento'),\n        novo_atend: n((c) => c.status === 'Novo' || c.status === 'Em atendimento'),\n        aguardando: n((c) => c.status === 'Aguardando'),\n        ag_cliente: n((c) => c.status === 'Aguardando' && c.justificativa === 'Retorno do cliente'),\n        ag_dev: n((c) => c.status === 'Aguardando' && c.justificativa === 'Equipe de desenvolvimento'),\n        sem_acao_7d: n((c) => c.dias_sem_acao > 7),\n        criticas: n((c) => /^(1|2)\\./.test(c.urgencia)),\n        sla_vencido: n((c) => c.sla_status === 'Vencido'),\n        sla_hoje: n((c) => c.sla_status === 'Vence hoje'),\n        sla_avencer: n((c) => c.sla_status === 'A vencer'),\n        sla_pausa: n((c) => c.sla_status === 'Em pausa'),\n        sla_nd: n((c) => !c.sla_status || c.sla_status === 'Não definido'),\n        sla_pct: (() => { const ok = n((c) => c.sla_status === 'A vencer' || c.sla_status === 'Vence hoje'), tot = ok + n((c) => c.sla_status === 'Vencido'); return tot ? `${Math.round((ok / tot) * 100)}%` : '—'; })(),\n        referencia: ref ? ref.ultima_acao : '',\n      });\n    }\n    return out;\n  },\n});\n\nconst gvGroup = (id, title, description, inputKey, fn) => dash.calc(id, { inputs: ['tabela'], title, description, fn });\n\ngvGroup('por_responsavel', 'Chamados por responsável', 'Contagem por responsável e status, do maior para o menor.', null, (tabela) => {\n  const m = new Map();\n  for (const c of tabela) { const k = c.responsavel || '(sem responsável)'; const r = m.get(k) || { responsavel: k, Novo: 0, 'Em atendimento': 0, Aguardando: 0, total: 0 }; r[c.status] += 1; r.total += 1; m.set(k, r); }\n  return [...m.values()].sort((a, b) => b.total - a.total);\n});\ngvGroup('por_cliente', 'Chamados por cliente', 'Contagem por empresa e status, da maior para a menor.', null, (tabela) => {\n  const m = new Map();\n  for (const c of tabela) { const k = c.empresa || '(empresa não informada)'; const r = m.get(k) || { empresa: k, Novo: 0, 'Em atendimento': 0, Aguardando: 0, total: 0 }; r[c.status] += 1; r.total += 1; m.set(k, r); }\n  return [...m.values()].sort((a, b) => b.total - a.total || a.empresa.localeCompare(b.empresa));\n});\ngvGroup('por_justificativa', 'Chamados por justificativa', 'Contagem por justificativa e status.', null, (tabela) => {\n  const m = new Map();\n  for (const c of tabela) { const k = c.justificativa || '(sem justificativa)'; const r = m.get(k) || { justificativa: k, Novo: 0, 'Em atendimento': 0, Aguardando: 0, total: 0 }; r[c.status] += 1; r.total += 1; m.set(k, r); }\n  return [...m.values()].sort((a, b) => b.total - a.total);\n});\ngvGroup('por_categoria', 'Chamados por categoria', 'Contagem por categoria e status.', null, (tabela) => {\n  const m = new Map();\n  for (const c of tabela) { const k = c.categoria || '(não informada)'; const r = m.get(k) || { categoria: k, Novo: 0, 'Em atendimento': 0, Aguardando: 0, total: 0 }; r[c.status] += 1; r.total += 1; m.set(k, r); }\n  return [...m.values()].sort((a, b) => b.total - a.total);\n});\ngvGroup('por_servico', 'Chamados por serviço', 'Contagem por serviço de 1º nível e status.', null, (tabela) => {\n  const m = new Map();\n  for (const c of tabela) { const k = c.servico || '(não informado)'; const r = m.get(k) || { servico: k, Novo: 0, 'Em atendimento': 0, Aguardando: 0, total: 0 }; r[c.status] += 1; r.total += 1; m.set(k, r); }\n  return [...m.values()].sort((a, b) => b.total - a.total);\n});\ngvGroup('por_urgencia', 'Chamados por urgência', 'Contagem por urgência e status, da mais crítica à mais baixa.', null, (tabela) => {\n  const ordem = ['1.Crítica', '2.Alta', '3.Média', '4.Baixa', '(não informada)'];\n  const m = new Map(ordem.map((k) => [k, { urgencia: k, Novo: 0, 'Em atendimento': 0, Aguardando: 0, total: 0 }]));\n  for (const c of tabela) { const r = m.get(c.urgencia || '(não informada)'); r[c.status] += 1; r.total += 1; }\n  return [...m.values()].filter((r) => r.total > 0);\n});\ngvGroup('faixa_sem_acao', 'Faixas de dias sem ação', 'Chamados por dias desde a última ação, em faixas, por status.', null, (tabela) => {\n  const faixas = [['Hoje ou ontem', 1], ['2 a 3 dias', 3], ['4 a 7 dias', 7], ['8 a 15 dias', 15], ['16 a 30 dias', 30], ['Mais de 30 dias', Infinity]];\n  const rows = faixas.map(([f]) => ({ faixa: f, Novo: 0, 'Em atendimento': 0, Aguardando: 0, total: 0 }));\n  for (const c of tabela) { const i = faixas.findIndex(([, max]) => c.dias_sem_acao <= max); rows[i][c.status] += 1; rows[i].total += 1; }\n  return rows;\n});\ngvGroup('faixa_aberto', 'Faixas de dias em aberto', 'Chamados por dias desde a abertura, em faixas, por status.', null, (tabela) => {\n  const faixas = [['Até 3 dias', 3], ['4 a 7 dias', 7], ['8 a 15 dias', 15], ['16 a 30 dias', 30], ['31 a 60 dias', 60], ['Mais de 60 dias', Infinity]];\n  const rows = faixas.map(([f]) => ({ faixa: f, Novo: 0, 'Em atendimento': 0, Aguardando: 0, total: 0 }));\n  for (const c of tabela) { const i = faixas.findIndex(([, max]) => c.dias_aberto <= max); rows[i][c.status] += 1; rows[i].total += 1; }\n  return rows;\n});\n<\/script>\n\n<script>\nconst GV_STATUS = ['Novo', 'Em atendimento', 'Aguardando'];\nconst GV_COR = ['var(--fap-c1)', 'var(--fap-c2)', 'var(--fap-c3)'];\nconst gvColor = (s) => GV_COR[GV_STATUS.indexOf(s)] || 'var(--cds-chart-muted)';\nconst gvSel = () => { const p = dash.params().status; const v = Array.isArray(p) ? GV_STATUS.filter((s) => p.includes(s)) : []; return v.length ? v : GV_STATUS.slice(); };\nconst gvFiltro = () => gvSel().join('|');\nconst gvSetStatus = () => { const v = []; document.querySelectorAll('#dash-root .gv-st').forEach((cb) => { if (cb.checked) v.push(cb.value); }); dash.setParams({ status: v.length ? v : GV_STATUS.slice() }); };\ndocument.querySelectorAll('#dash-root .gv-st').forEach((cb) => cb.addEventListener('change', gvSetStatus));\ndocument.querySelectorAll('#dash-root .gv-todos').forEach((b) => b.addEventListener('click', () => dash.setParams({ status: GV_STATUS.slice() })));\ndash.onData(() => {\n  const sel = gvSel();\n  document.querySelectorAll('#dash-root .gv-st').forEach((cb) => { cb.checked = sel.includes(cb.value); });\n  document.querySelectorAll('#dash-root [data-tile]').forEach((t) => t.classList.toggle('off', !t.dataset.tile.split('|').some((s) => sel.includes(s))));\n});\nconst gvFmt = (v) => (typeof v === 'number' ? v.toLocaleString('pt-BR') : (v ?? ''));\n\n// Cores das legendas (estilo apenas)\ndocument.querySelectorAll('#dash-root [data-sw]').forEach((el) => { el.style.background = gvColor(el.dataset.sw); });\n\ndash.draw('abk', (el) => {\n  const d = dash.data(el.dataset.source);\n  const row = d.status === 'ok' && d.data.length ? d.data[0] : null;\n  if (!row) { el.textContent = '—'; return; }\n  const v = row[el.dataset.field];\n  el.textContent = typeof v === 'number' ? v.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) : v;\n});\n\ndash.draw('abbar', (el) => {\n  const d = dash.data(el.dataset.source);\n  el.replaceChildren();\n  if (d.status === 'error') {\n    const f = document   });
  function abrir(id,foco){
    if(ids.indexOf(id)<0)id='release';
    ids.forEach(function(k){
      var t=document.getElementById('tab-'+k),p=document.getElementById('p-'+k),on=k===id;
      t.setAttribute('aria-selected',on?'true':'false');t.tabIndex=on?0:-1;p.hidden=!on;
    });
    if(foco)document.getElementById('tab-'+id).focus();
    try{history.replaceState(null,'','#'+id);}catch(e){}
    scrollTo(0,0);
  }
  document.querySelectorAll('.uni-tab').forEach(function(t){
    t.addEventListener('click',function(){abrir(t.dataset.alvo);});
    t.addEventListener('keydown',function(e){
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();var i=ids.indexOf(t.dataset.alvo);abrir(ids[(i+(e.key==='ArrowRight'?1:ids.length-1))%ids.length],true);}
    });
  });
  abrir((location.hash||'').slice(1));
})();
</script>
</body></html>
